<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Ball App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-dragonball">
    <header class="py-5 text-center">
        <h1 class="display-3 text-warning">Dragon Ball App</h1>
        <p class="lead text-light">Explora el universo de Dragon Ball</p>
    </header>

    <main class="container">
        <section class="mb-5">
            <form id="form-busqueda" class="mb-4">
                <div class="input-group">
                    <input type="text" id="nombre_buscar" class="form-control" placeholder="Buscar personaje por nombre">
                    <button type="submit" class="btn btn-danger">Buscar</button>
                    <button type="button" id="btn-limpiar" class="btn btn-outline-light">Limpiar</button>
                </div>
            </form>
            <div id="mensaje" class="alert alert-info mb-3" style="display: none;"></div>
        </section>

        <section>
            <div id="loading" class="text-center my-4" style="display: none;">
                <div class="spinner-border text-warning" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
            </div>
            <div id="personajes" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
            <div id="loading-scroll" class="text-center my-4" style="display: none;">
                <div class="spinner-border text-warning" role="status">
                    <span class="visually-hidden">Cargando más personajes...</span>
                </div>
            </div>
        </section>
    </main>

    <div class="modal fade" id="modal-detalles" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-dark text-light">
                <div class="modal-header bg-danger">
                    <h5 class="modal-title" id="modal-titulo"></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modal-cuerpo"></div>
                <div class="modal-footer bg-secondary">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
